name: Build and Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # タグ v1.2.3 → アプリのバージョン 1.2.3
  APP_VERSION: ${{ github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        shell: bash
        run: |
          # jpackage のバージョンは数字 3 つ (MSI は MAJOR/MINOR <= 255, BUILD <= 65535)
          if [[ ! "$APP_VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] \
             || (( BASH_REMATCH[1] > 255 || BASH_REMATCH[2] > 255 || BASH_REMATCH[3] > 65535 )); then
            echo "::error::タグは vMAJOR.MINOR.PATCH 形式にしてください (例: v1.2.3): $APP_VERSION"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Package
        shell: bash
        env:
          # ランナーは英語ロケールなので、jpackage が cp1252 で WiX を動かし、日本語の description で失敗する。
          # Java を日本語ロケールにすると日本語 (cp932) のインストーラになる
          JAVA_TOOL_OPTIONS: ${{ runner.os == 'Windows' && '-Duser.language=ja -Duser.country=JP' || '' }}
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:packageDistributionForCurrentOS :desktopApp:packageUberJarForCurrentOS :desktopApp:createDistributable -PappVersion=${APP_VERSION#v} --no-configuration-cache

      # インストール不要版 (ランタイム同梱のアプリフォルダ) をアーカイブにする
      - name: Archive portable app
        shell: bash
        run: |
          v=${APP_VERSION#v}
          out=$PWD/desktopApp/build/portable
          mkdir -p "$out"
          cd desktopApp/build/compose/binaries/main/app
          case "$RUNNER_OS" in
            Windows) 7z a "$out/TAAssistant-windows-x64-$v-portable.zip" TAAssistant ;;
            # ditto はシンボリックリンクや .app の属性を保ったまま zip にできる
            macOS)   ditto -c -k --keepParent TAAssistant.app "$out/TAAssistant-macos-arm64-$v-portable.zip" ;;
            # 実行権限を保つため tar.gz にする
            Linux)   tar czf "$out/TAAssistant-linux-x64-$v-portable.tar.gz" TAAssistant ;;
          esac

      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/dmg/*.dmg
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/jars/*.jar
            desktopApp/build/portable/*
          if-no-files-found: error

      - name: Upload jpackage logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jpackage-logs-${{ matrix.os }}
          path: desktopApp/build/compose/logs/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # upload-artifact はフォルダ階層を残すので、ファイルだけを集める
          mapfile -t files < <(find dist -type f)
          printf '%s\n' "${files[@]}"
          if gh release view "$APP_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # 前回の失敗などでリリースが残っている場合はファイルを上書きして公開する
            gh release upload "$APP_VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$APP_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            gh release create "$APP_VERSION" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$APP_VERSION" \
              --generate-notes
          fi
